name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Cloudflare Access
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ALLOWED_EMAIL: ${{ secrets.ACCESS_ALLOWED_EMAIL }}
        run: python3 .github/scripts/ensure-access.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare Grok webhook secrets
        id: grok
        env:
          GROK_WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          GROK_WEBHOOK_KEY: ${{ secrets.GROK_WEBHOOK_KEY }}
          GROK_WEBHOOK_AUTH: ${{ secrets.GROK_WEBHOOK_AUTH }}
        run: |
          set -euo pipefail
          if [ -n "${GROK_WEBHOOK_URL}" ]; then echo "::add-mask::${GROK_WEBHOOK_URL}"; fi
          if [ -n "${GROK_WEBHOOK_KEY}" ]; then echo "::add-mask::${GROK_WEBHOOK_KEY}"; fi
          if [ -n "${GROK_WEBHOOK_AUTH}" ]; then echo "::add-mask::${GROK_WEBHOOK_AUTH}"; fi
          python3 << 'PY'
          import json, os
          names = ("GROK_WEBHOOK_URL", "GROK_WEBHOOK_KEY", "GROK_WEBHOOK_AUTH")
          present = [name for name in names if os.environ.get(name, "").strip()]
          flag = os.path.join(os.environ["RUNNER_TEMP"], "grok-secret-names")
          if not present:
              open(flag, "w").write("")
          else:
              path = os.path.join(os.environ["RUNNER_TEMP"], "grok-secrets.json")
              with open(path, "w") as handle:
                  json.dump({name: os.environ[name] for name in present}, handle)
              os.chmod(path, 0o600)
              open(flag, "w").write(" ".join(present))
          PY
          names="$(cat "${RUNNER_TEMP}/grok-secret-names")"
          if [ -z "$names" ]; then
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "Grok webhook secrets are absent. /api/continue will return 503."
            exit 0
          fi
          echo "extra=--secrets-file ${RUNNER_TEMP}/grok-secrets.json" >> "$GITHUB_OUTPUT"
          echo "Grok webhook secrets to upload: ${names}"
          case " $names " in
            *" GROK_WEBHOOK_URL "*) ;;
            *) echo "GROK_WEBHOOK_URL is absent. /api/continue will return 503." ;;
          esac
          case " $names " in
            *" GROK_WEBHOOK_AUTH "*|*" GROK_WEBHOOK_KEY "*) ;;
            *) echo "No webhook credential is set. /api/continue will return 503." ;;
          esac

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --env production --var TEAM_DOMAIN:https://staho.cloudflareaccess.com --var POLICY_AUD:${{ steps.access.outputs.aud }} ${{ steps.grok.outputs.extra }}

      - name: Smoke test Access login
        run: bash .github/scripts/smoke-access.sh
